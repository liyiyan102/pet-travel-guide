<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>带爪旅行 · 图标库</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:-apple-system,'SF Pro Display','PingFang SC',sans-serif; background:#F7F7F8; color:#1A1D1F; padding:48px; }
  h1 { font-size:32px; font-weight:800; letter-spacing:-0.8px; margin-bottom:8px; }
  .sub { font-size:14px; color:#6E7681; margin-bottom:40px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; max-width:1200px; }
  .card { background:#fff; border-radius:16px; padding:28px 16px 20px; text-align:center; border:1px solid #F0F0F2; transition:transform 0.15s, box-shadow 0.15s; cursor:pointer; }
  .card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.06); }
  .card svg { width:32px; height:32px; fill:none; stroke:#1A1D1F; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; margin-bottom:14px; }
  .name { font-size:12px; font-weight:600; color:#1A1D1F; }
  .id { font-size:10px; color:#A8B0B8; margin-top:3px; font-family:'SF Mono',monospace; }
  .stats { margin-top:40px; font-size:13px; color:#6E7681; }
</style>
</head>
<body>

<h1>带爪旅行 · 图标库</h1>
<div class="sub">iOS SF Symbols 风 · 35 个图标 · viewBox 0 0 24 24 · stroke 1.7 · currentColor 继承</div>

<div class="grid" id="grid"></div>

<div class="stats" id="stats"></div>

  "home": '<path d="M3.3 10.8L12 4.2l8.7 6.6"/><path d="M5.2 10.2v9.8h13.6v-9.8"/>',

const grid = document.getElementById('grid');
icons.forEach(([name, id, label]) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <svg viewBox="0 0 24 24">${paths[name] || ''}</svg>
    <div class="name">${label}</div>
    <div class="id">${name}.svg</div>
  `;
  grid.appendChild(card);
});

document.getElementById('stats').textContent = `共 ${icons.length} 个图标 · 点击卡片可复制 SVG 路径`;
</script>
</body>
</html>
