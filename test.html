<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱 猫豆 - 宠物旅行助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #e8f8f5 0%, #d5f4e6 100%);
      min-height: 100vh;
    }

    /* 顶部导航 */
    .header {
      background: linear-gradient(135deg, #27AE60 0%, #1E8449 100%);
      color: white;
      padding: 16px 24px;
      box-shadow: 0 2px 12px rgba(39,174,96,0.3);
    }
    .header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .header .status { font-size: 12px; opacity: 0.9; margin-top: 4px; }
    .status-dot { 
      width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; 
      display: inline-block; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }

    /* 主容器 */
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }

    /* 快捷问题按钮 */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .quick-btn {
      padding: 10px 18px;
      background: white;
      border: 2px solid #27AE60;
      border-radius: 24px;
      color: #27AE60;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .quick-btn:hover {
      background: #27AE60;
      color: white;
      transform: translateY(-2px);
    }

    /* 聊天区域 */
    .chat-box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .messages {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    /* 消息气泡 */
    .msg { max-width: 85%; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    
    .msg-user {
      align-self: flex-end;
      background: linear-gradient(135deg, #27AE60, #1E8449);
      color: white;
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      font-size: 15px;
      line-height: 1.5;
    }
    .msg-bot {
      align-self: flex-start;
      background: #f5f7fa;
      color: #333;
      padding: 12px 18px;
      border-radius: 18px 18px 18px 4px;
      font-size: 15px;
      line-height: 1.6;
    }
    .msg-bot .bot-name {
      font-size: 12px;
      color: #27AE60;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* 建议按钮 */
    .suggestions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .suggest-btn {
      padding: 6px 14px;
      background: white;
      border: 1px solid #27AE60;
      border-radius: 16px;
      color: #27AE60;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggest-btn:hover { background: #e8f8f5; }

    /* 图片预览 */
    .image-preview {
      max-width: 200px;
      max-height: 150px;
      border-radius: 8px;
      margin-top: 8px;
      object-fit: cover;
    }

    /* 输入区域 */
    .input-area {
      display: flex;
      padding: 16px;
      border-top: 1px solid #eee;
      gap: 12px;
      align-items: flex-end;
    }
    .input-wrapper {
      flex: 1;
      position: relative;
    }
    .input-wrapper textarea {
      width: 100%;
      padding: 12px 50px 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      font-size: 15px;
      resize: none;
      outline: none;
      transition: border-color 0.3s;
      font-family: inherit;
      min-height: 46px;
      max-height: 120px;
    }
    .input-wrapper textarea:focus { border-color: #27AE60; }
    
    .btn-upload {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .btn-upload:hover { opacity: 1; }
    
    .btn-send {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #27AE60, #1E8449);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .btn-send:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(39,174,96,0.4); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* 加载动画 */
    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #27AE60;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%,80%,100% { transform:scale(0.6); } 40% { transform:scale(1); } }

    /* 来源标签 */
    .source-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 8px;
    }
    .source-local { background: #e8f8f5; color: #27AE60; }
    .source-web { background: #ebf5fb; color: #2980b9; }
    .source-ai { background: #fef9e7; color: #f39c12; }

    /* 隐藏文件输入 */
    #fileInput { display: none; }

    /* 响应式 */
    @media (max-width: 600px) {
      .container { padding: 10px; }
      .messages { height: 400px; padding: 12px; }
      .msg { max-width: 95%; }
      .quick-btn { padding: 8px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🐱 猫豆助手</h1>
  <div class="status"><span class="status-dot"></span> 服务运行中</div>
</div>

<div class="container">

  <!-- 快捷操作 -->
  <div class="quick-actions">
    <button class="quick-btn" onclick="sendQuick('帮我规划杭州3天带狗旅行')">🗺️ 规划行程</button>
    <button class="quick-btn" onclick="sendQuick('附近有什么宠物友好餐厅？')">🍽️ 找餐厅</button>
    <button class="quick-btn" onclick="sendQuick('狗狗能吃巧克力吗？')">⚠️ 食物安全</button>
    <button class="quick-btn" onclick="sendQuick('坐高铁能带宠物吗？')">🚄 出行政策</button>
    <button class="quick-btn" onclick="sendQuick('金毛犬适合长途旅行吗？')">🐕 品种知识</button>
    <button class="quick-btn" onclick="clearChat()">🗑️ 清空对话</button>
  </div>

  <!-- 聊天框 -->
  <div class="chat-box">
    <div class="messages" id="messages">
      <div class="msg msg-bot">
      <div class="bot-name">🐱 猫豆</div>
      你好呀！我是宠物友好旅行AI助手 🎉<br><br>
      我可以帮你：<br>
      📍 规划宠物友好行程<br>
      🔍 搜索周边宠物场所<br>
      📸 识别图片中的宠物/食物<br>
      💡 回答养宠出行问题<br><br>
      点击上方快捷按钮或直接输入你想问的～
      </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
      <div class="input-wrapper">
        <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this)">
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">📷</button>
        <textarea id="input" placeholder="输入你的问题..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
const API_URL = '/api/chat';
let sessionId = 'session_' + Date.now();
let selectedImage = null;

// 自动调整输入框高度
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// 发送消息
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  
  if (!text && !selectedImage) return;

  // 显示用户消息
  if (text) {
    addMessage(text, 'user');
  }
  if (selectedImage) {
    addUserImage(selectedImage);
  }

  input.value = '';
  input.style.height = 'auto';
  selectedImage = null;

  // 显示加载
  showTyping();
  disableSend(true);

  try {
    const body = {
      message: text || '',
      userId: 'web_user',
      sessionId: sessionId
    };

    // 如果有图片，转为base64
    if (selectedImageData) {
      body.images = [selectedImageData];
      selectedImageData = null;
    }

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    hideTyping();
    disableSend(false);

    const data = await res.json();

    if (data.success && data.response) {
      addBotMessage(data.response);
    } else {
      addMessage('❌ 出错了：' + (data.error || '未知错误'), 'bot');
    }
  } catch (err) {
    hideTyping();
    disableSend(false);
    addMessage('❌ 连接失败：请确保服务已启动 (http://localhost:3000)', 'bot');
  }
}

// 添加消息气泡
function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = `msg msg-${type}`;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function addBotMessage(resp) {
  const div = document.createElement('div');
  div.className = 'msg msg-bot';
  
  let html = `<div class="bot-name">🐱 猫豆</div>`;
  html += `<div>${resp.content}</div>`;
  
  // 来源标注
  if (resp.sources && resp.sources.length > 0) {
    html += '<div style="margin-top:8px">';
    resp.sources.forEach(s => {
      const cls = s.type === 'local' ? 'source-local' : s.type === 'web' ? 'source-web' : 'source-ai';
      html += `<span class="source-tag ${cls}">${s.label}</span>`;
    });
    html += '</div>';
  }

  // 建议按钮
  if (resp.suggestions && resp.suggestions.length > 0) {
    html += '<div class="suggestions">';
    resp.suggestions.forEach(s => {
      html += `<button class="suggest-btn" onclick="sendQuick('${s.text}')">${s.text}</button>`;
    });
    html += '</div>';
  }

  div.innerHTML = html;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function addUserImage(src) {
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<img src="${src}" class="image-preview">`;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

// 快捷发送
function sendQuick(text) {
  document.getElementById('input').value = text;
  sendMessage();
}

// 图片处理
let selectedImageData = null;
function handleFile(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      selectedImage = e.target.result;
      selectedImageData = e.target.result;
      
      // 显示在输入框提示
      const textarea = document.getElementById('input');
      textarea.placeholder = '📷 已选择图片，可直接发送或添加描述...';
    };
    reader.readAsDataURL(file);
  }
  input.value = '';
}

// 键盘事件
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// 加载动画
function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg msg-bot typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function disableSend(disabled) {
  document.getElementById('sendBtn').disabled = disabled;
}

function clearChat() {
  document.getElementById('messages').innerHTML = '';
  sessionId = 'session_' + Date.now();
  fetch('/api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId })
  });
  addBotMessage({
    content: '对话已清空！有什么可以帮你的吗？🐾',
    suggestions: [
      { text: '帮我规划一次旅行' },
      { text: '狗狗能吃葡萄吗' },
      { text: '怎么带猫坐飞机' }
    ]
  });
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}
</script>

</body>
</html>
